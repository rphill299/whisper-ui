name: whisper-ui
channels:
  - conda-forge
  - pytorch
dependencies:
  - python
  - llvmlite
  - numba
  - numpy<2.0
  - pytorch
  - torchaudio
  - pip
  - pip:
      - flask
      - flask-cors
      - python-dotenv
      - openai-whisper
      - soundfile
      - librosa
      - pydub
      - pyannote.audio
      - git+https://github.com/huggingface/transformers


